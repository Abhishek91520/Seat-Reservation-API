services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: seat-reservation-api:pgbouncer
    container_name: seat_reservation_app_pgbouncer
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Connect through PgBouncer on port 6432
      - DATABASE_URL=postgresql://postgres:postgres@pgbouncer:6432/seat_reservation
      - PORT=8000
      - HOST=0.0.0.0
      - JWT_SECRET=seat-reservation-dev-secret-change-in-prod
      - ADMIN_TOKEN=admin-secret-token
      - DB_POOL_MIN_SIZE=15
      - DB_POOL_MAX_SIZE=15
      - DB_SEMAPHORE_SIZE=15
      # Required for PgBouncer transaction mode:
      - DB_STATEMENT_CACHE_SIZE=0
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: seat_reservation_pgbouncer
    ports:
      - "6432:6432"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=seat_reservation
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - RESERVE_POOL_SIZE=5
      - AUTH_TYPE=trust
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: seat_reservation_postgres_raw
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seat_reservation
    volumes:
      - postgres_data_pgbouncer:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_pgbouncer:
