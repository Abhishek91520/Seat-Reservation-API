name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linter (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests (Unit, Integration, Concurrency)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/testdb
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/testdb
          JWT_SECRET: ci-jwt-secret-testing
          ADMIN_TOKEN: ci-admin-secret-token
          DB_POOL_MIN_SIZE: 15
          DB_POOL_MAX_SIZE: 15
          DB_SEMAPHORE_SIZE: 15
        run: |
          pytest -m "not chaos and not canary" -v

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t seat-reservation-api:latest -f Dockerfile .

      - name: Launch Stack via Docker Compose
        run: |
          docker compose up -d

      - name: Smoke Check /readyz
        run: |
          echo "Waiting for app to become ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/readyz || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "App is healthy and ready (HTTP 200)!"
              curl -s http://localhost:8000/readyz
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, waiting 1s..."
            sleep 1
          done
          echo "Timeout waiting for /readyz"
          docker compose logs
          exit 1

      - name: Clean up Docker Stack
        if: always()
        run: |
          docker compose down -v
