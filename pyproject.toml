[project]
name = "seat-reservation-api"
version = "0.1.0"
description = "High-concurrency seat reservation API designed for extreme throughput and correctness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "concurrency: High-concurrency tests",
    "chaos: Chaos and failure-injection tests",
    "canary: Canary mutation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
