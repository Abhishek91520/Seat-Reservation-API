services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: seat-reservation-api:prodlike
    container_name: seat_reservation_app_prodlike
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/seat_reservation
      - PORT=8000
      - HOST=0.0.0.0
      - JWT_SECRET=seat-reservation-dev-secret-change-in-prod
      - ADMIN_TOKEN=admin-secret-token
      - DB_POOL_MIN_SIZE=15
      - DB_POOL_MAX_SIZE=15
      - DB_SEMAPHORE_SIZE=15
      - DB_STATEMENT_CACHE_SIZE=100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: seat_reservation_postgres_prodlike
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seat_reservation
    volumes:
      - postgres_data_prodlike:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_prodlike:
